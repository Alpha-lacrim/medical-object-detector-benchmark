[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "meddet-benchmark"
version = "0.1.0"
description = "Reproducible Faster R-CNN and YOLO benchmark for medical images"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.4",
  "albumentations==2.0.8",
  "scipy==1.17.1",
  "Pillow==12.3.0",
  "matplotlib==3.11.1",
  "pycocotools==2.0.11",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "pydicom==3.0.2",
  "kaggle==2.2.3",
]

[project.optional-dependencies]
cpu = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "ultralytics==8.4.110",
]
cu124 = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "ultralytics==8.4.110",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/meddet_benchmark"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
