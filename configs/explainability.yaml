schema_version: 1
experiment_id: rsna-phase7-primary-seed-gradcam
seed: 17

phase6_config: configs/corruptions.yaml
phase6_summary: results/logs/phase6_robustness/summary.json

gradcam:
  method: grad_cam
  target_score: post_activation_foreground_probability
  target_selection: highest_iou_then_score_low_threshold_retained_candidate
  candidate_score_floor: 0.0
  nms_iou_threshold: 0.5
  max_candidates: 100
  yolo_max_nms_candidates: 30000
  yolo_nms_time_limit_seconds: 1.0
  interpolation_mode: bilinear
  align_corners: false
  epsilon: 1.0e-12
  zero_energy_epsilon: 1.0e-12
  zero_energy_policy: exclude_and_report

metric:
  population: every_ground_truth_box_in_phase6_sample
  unit: ground_truth_box
  box_rasterization: pixel_center
  primary: energy_in_box
  secondary: pointing_game
  random_baseline: rasterized_box_area_fraction

runtime:
  device: cuda
  smoke_positive_images: 2
  progress_every_images: 10

detectors:
  - detector: faster_rcnn
    module_path: backbone.body.layer3
    expected_stride: 16
    expected_spatial_size: 40
    stage_description: ResNet-50 C4 output before FPN
  - detector: yolo11s
    module_path: model.6
    expected_stride: 16
    expected_spatial_size: 40
    stage_description: YOLO11 backbone P4 block before the stride-32 stage and PAN neck

qualitative:
  cases_per_category: 3
  good_selection: highest_minimum_iou_shared_true_positive_unique_image
  bad_selection: highest_minimum_score_shared_false_positive_negative_image
  failure_selection: shared_false_negative_proxy_iou_quantiles_unique_image
  failure_quantiles: [0.2, 0.5, 0.8]
  overlay_alpha: 0.48
  colormap: inferno
  ground_truth_color: lime
  candidate_color: cyan
  line_width: 1.6
  panel_width_inches: 4.2
  row_height_inches: 4.0
  dpi: 180

outputs:
  log_dir: results/logs/phase7_explainability
  smoke_summary: results/logs/phase7_explainability/smoke_summary.json
  summary_json: results/logs/phase7_explainability/summary.json
  target_table: results/tables/gradcam_localization_per_target.csv
  aggregate_table: results/tables/gradcam_localization_summary.csv
  qualitative_manifest: results/tables/gradcam_qualitative_cases.csv
  good_figure: results/figures/gradcam_good_predictions.png
  bad_figure: results/figures/gradcam_bad_predictions.png
  failure_figure: results/figures/gradcam_failure_cases.png
