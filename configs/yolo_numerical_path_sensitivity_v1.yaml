    selection_seeds:
    - 17
    - 42
    - 137
    - 271
    - 314
    source_config: configs/threshold_selection_n5_validation_sensitivity.yaml
    source_summary: results/logs/phase43_threshold_selection_n5_validation_sensitivity/summary.json
    source_table: results/tables/threshold_selection_test_operating_points_n5_validation_sensitivity.csv
  metrics:
  - precision
  - recall
  - f1
  - fp_per_image
  - detections_per_image
  - percent_images_with_detections
  report_counts:
  - tp
  - fp
  - fn
  - detections
  - images_with_detections
  - images
  - target_boxes
  select_external_threshold: false
score_summaries:
  unit: emitted_detection
  populations:
  - all_retained_candidates
  - ap_candidates
  - historical_threshold
  - posthoc_n5_threshold
  statistics:
  - detection_count
  - min
  - quantiles
  - median
  - mean
  - max
  quantiles:
  - 0.01
  - 0.05
  - 0.25
  - 0.5
  - 0.75
  - 0.95
  - 0.99
  quantile_method: linear
  empty_population: count_zero_other_statistics_null
  aggregation: per_run_then_equal_run_mean_and_sample_sd
  ecdf: per_run_no_pooling_across_runs
  clinical_probability_interpretation: false
agreement:
