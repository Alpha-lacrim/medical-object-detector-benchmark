  - 0.001
  - 0.01
  - 0.05
  - 0.25
  zero_support: 'null'
  quantiles:
  - 0.01
  - 0.05
  - 0.25
  - 0.5
  - 0.75
  - 0.95
  - 0.99
statistics:
  standard_deviation_ddof: 1
  aggregate: equal_run_mean_and_sample_sd
  paired_unit: same_checkpoint_same_image_only
  hypothesis_tests: false
  materiality: descriptive_magnitude_and_qualitative_conclusion_no_new_significance_cutoff
outputs:
