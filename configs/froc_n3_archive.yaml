schema_version: 1
analysis_id: rsna-phase14-test-froc-n3-archive

inputs:
  threshold_config: configs/threshold_sweep_n3_frozen.yaml
  threshold_summary: results/logs/phase10_threshold_sweep/summary.json
  threshold_per_seed_table: results/tables/threshold_sweep_per_seed.csv

analysis:
  fp_per_image_budgets: [0.125, 0.25, 0.5, 1.0, 2.0]
  numeric_tolerance: 1.0e-12

detectors:
  faster_rcnn:
    label: Faster R-CNN
    color: "#1f77b4"
  yolo11s:
    label: YOLO11s
    color: "#d95f02"

plot:
  dpi: 180
  figure_width: 9.2
  figure_height: 6.2
  minimum_x: 0.0625
  maximum_x: 8.0

outputs:
  operating_points_table: results/tables/froc_operating_points_n3_archive_reproduction.csv
  figure: results/figures/froc_curves_n3_archive_reproduction.png
  summary_json: results/logs/phase14_froc_n3_archive_reproduction/summary.json
