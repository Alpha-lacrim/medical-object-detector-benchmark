schema_version: 2
experiment_id: rsna-radiography-synthetic-shift-sensitivity
seed: 17

inputs:
  phase6_config: configs/corruptions.yaml
  dataset_config: configs/dataset.yaml
  subset_manifest: data/splits/rsna-pneumonia-5000/test_robustness_seed17_n300.csv
  expected_subset_manifest_sha256: 63b4dd706dc2fcd8a528a935957ccb318ed2cde51a6fd87d20feca348d00fc5e
  processed_id_column: processed_file
  raw_file_column: source_file
  historical_results_table: results/tables/acquisition_shift_results.csv
  expected_historical_results_sha256: 2cd14283f3b3609054075ad6de8861a3b56196a30e536d0ca2888d91442a345e
  historical_summary_json: results/logs/phase22_acquisition_shifts/summary.json
  expected_historical_summary_sha256: 4782ac7cba8429f6a5968c25272160110fc5add92820ef02c0414a12b043f692

metadata_contract:
  allowed_modalities: [CR]
  # The files carry CR as Modality but use the single-frame Secondary Capture
  # SOP Class, not the Computed Radiography Image Storage SOP Class.
  allowed_sop_class_uids: [1.2.840.10008.5.1.4.1.1.7]
  allowed_photometric_interpretations: [MONOCHROME1, MONOCHROME2]
  allowed_conversion_types: [WSD]
  allowed_lossy_image_compression_values: ['01']
  allowed_lossy_image_compression_methods: [ISO_10918_1]
  bits_allocated: 8
  bits_stored: 8
  pixel_representation: 0
  require_native_voi_absent: true
  require_modality_transform_absent: true

runtime:
  smoke_images: 2

diagnostics:
  almost_complete_residual_ratio_max: 0.05
  partial_cancellation_fraction_min: 0.20

# These are controlled sensitivity settings, not recovered scanner presets,
# dose simulations, or scanner-specific kernels. The DICOM LINEAR conditions use the
# per-image full-input-range identity window defined in PS3.3 C.11.2.1.2.1 as
# their baseline, then perturb its center or width.
shifts:
  - id: voi_center_lower
    family: display_transform
    kind: dicom_linear_window
    display_name: DICOM LINEAR center -15% of full-input-range width
    scientific_class: A
    retained_use_class: A
    interpretation: Synthetic DICOM display-transform sensitivity; not a recovered display preset.
    center_offset_fraction: -0.15
    width_multiplier: 1.0
  - id: voi_center_higher
    family: display_transform
    kind: dicom_linear_window
    display_name: DICOM LINEAR center +15% of full-input-range width
    scientific_class: A
    retained_use_class: A
    interpretation: Synthetic DICOM display-transform sensitivity; not a recovered display preset.
    center_offset_fraction: 0.15
    width_multiplier: 1.0
  - id: voi_width_narrow
    family: display_transform
    kind: dicom_linear_window
    display_name: DICOM LINEAR width x0.75
    scientific_class: A
    retained_use_class: A
    interpretation: Synthetic DICOM display-transform sensitivity; not a recovered display preset.
    center_offset_fraction: 0.0
    width_multiplier: 0.75
  - id: voi_width_wide
    family: display_transform
    kind: dicom_linear_window
    display_name: DICOM LINEAR width x1.25
    scientific_class: A
    retained_use_class: A
    interpretation: Synthetic DICOM display-transform sensitivity; not a recovered display preset.
    center_offset_fraction: 0.0
    width_multiplier: 1.25

  # These legacy IDs are retained so the exact historical transformed pixels
  # and prediction bundles stay traceable. They are not scientific dose labels.
  # The count budgets create signal-dependent Poisson-like variance only.
  - id: poisson_dose_50pct
    family: poisson_like_intensity_noise
    kind: poisson_like_noise
    display_name: Poisson-like noise at relative count budget 0.50
    scientific_class: D
    retained_use_class: B
    interpretation: Physically unsupported as dose/quantum noise for these stored values; retained as generic signal-dependent intensity sensitivity.
    reference_full_scale_counts: 4096.0
    relative_count_fraction: 0.50
  - id: poisson_dose_25pct
    family: poisson_like_intensity_noise
    kind: poisson_like_noise
    display_name: Poisson-like noise at relative count budget 0.25
    scientific_class: D
    retained_use_class: B
    interpretation: Physically unsupported as dose/quantum noise for these stored values; retained as generic signal-dependent intensity sensitivity.
    reference_full_scale_counts: 4096.0
    relative_count_fraction: 0.25
  - id: poisson_dose_12p5pct
    family: poisson_like_intensity_noise
    kind: poisson_like_noise
    display_name: Poisson-like noise at relative count budget 0.125
    scientific_class: D
    retained_use_class: B
    interpretation: Physically unsupported as dose/quantum noise for these stored values; retained as generic signal-dependent intensity sensitivity.
    reference_full_scale_counts: 4096.0
    relative_count_fraction: 0.125

  - id: gaussian_kernel_3
    family: spatial_resolution_blur
    kind: gaussian_blur
    display_name: Gaussian blur 3x3, sigma 0.5 px
    scientific_class: C
    retained_use_class: C
    interpretation: Generic blur/spatial-resolution proxy; not a detector or reconstruction model.
    gaussian_kernel_size: 3
    gaussian_sigma_pixels: 0.5
  - id: gaussian_kernel_5
    family: spatial_resolution_blur
    kind: gaussian_blur
    display_name: Gaussian blur 5x5, sigma 1.0 px
    scientific_class: C
    retained_use_class: C
    interpretation: Generic blur/spatial-resolution proxy; not a detector or reconstruction model.
    gaussian_kernel_size: 5
    gaussian_sigma_pixels: 1.0
  - id: gaussian_kernel_9
    family: spatial_resolution_blur
    kind: gaussian_blur
    display_name: Gaussian blur 9x9, sigma 2.0 px
    scientific_class: C
    retained_use_class: C
    interpretation: Generic blur/spatial-resolution proxy; not a detector or reconstruction model.
    gaussian_kernel_size: 9
    gaussian_sigma_pixels: 2.0

outputs:
  log_dir: results/logs/phase22_acquisition_shifts
  prediction_bundles_dir: results/logs/phase22_acquisition_shifts/predictions
  smoke_log_dir: results/logs/phase22_acquisition_shifts/smoke
  smoke_prediction_bundles_dir: results/logs/phase22_acquisition_shifts/smoke/predictions
  smoke_summary_json: results/logs/phase22_acquisition_shifts/smoke/summary.json
  smoke_results_table: results/logs/phase22_acquisition_shifts/smoke/results.csv
  summary_json: results/logs/phase22_acquisition_shifts/summary.json
  results_table: results/tables/acquisition_shift_results.csv
  audit_log_dir: results/logs/phase32_acquisition_shift_audit
  metadata_audit_table: results/tables/acquisition_shift_dicom_metadata_audit.csv
  preprocessing_per_image_table: results/tables/acquisition_shift_preprocessing_per_image.csv
  preprocessing_summary_table: results/tables/acquisition_shift_preprocessing_summary.csv
  reclassified_results_table: results/tables/radiography_synthetic_shift_results.csv
  audit_summary_json: results/logs/phase32_acquisition_shift_audit/summary.json
