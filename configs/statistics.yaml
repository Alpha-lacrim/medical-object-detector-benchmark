schema_version: 3
experiment_id: rsna-phase8-paired-statistical-analysis
seed: 20260811

inputs:
  phase5_config: configs/evaluation.yaml
  phase5_summary: results/logs/phase5_evaluation/summary.json
  phase6_config: configs/corruptions.yaml
  phase6_summary: results/logs/phase6_robustness/summary.json
  test_annotations: data/processed/rsna-pneumonia-5000/annotations/instances_test.json
  test_split_manifest: data/splits/rsna-pneumonia-5000/test.csv

analysis:
  detector_a: faster_rcnn
  detector_b: yolo11s
  metrics: [precision, recall, f1, iou, dice, map_50, map_50_95]
  clean_seed_eligibility:
    all_attempt_metrics: [precision, recall, f1, map_50, map_50_95]
    all_attempt_seeds: [17, 42, 137, 271, 314]
    paired_complete_case_metrics: [iou, dice]
    paired_complete_case_seeds: [17, 42, 137, 314]
    expected_undefined:
      - detector: yolo11s
        seed: 271
        metrics: [iou, dice]
        true_positives: 0
        prediction_count: 0
        reason: no_detections_at_frozen_score_threshold
  confidence_level: 0.95
  bootstrap_resamples: 2000
  permutation_resamples: 5000
  bootstrap_method: paired_hierarchical_patient_cluster_percentile
  permutation_method: paired_patient_cluster_label_swap
  effect_size: paired_raw_difference_with_cluster_bootstrap_ci
  manifest_image_column: processed_file
  patient_group_column: nih_patient_id
  multiple_comparison_correction: holm
  clean_correction_scope: across_7_predictive_metrics
  corruption_correction_scope: per_metric_and_estimand_across_35_corrupted_conditions
  include_raw_corruption_comparisons: true
  include_clean_relative_retention_comparisons: true

outputs:
  log_dir: results/logs/phase8_statistics
  summary_json: results/logs/phase8_statistics/summary.json
  clean_table: results/tables/statistical_clean_comparison.csv
  robustness_table: results/tables/statistical_robustness_comparison.csv
  image_level_summary_archive: results/logs/phase8_statistics/summary_image_level_archive.json
  image_level_clean_table_archive: results/tables/statistical_clean_comparison_image_level_archive.csv
  image_level_robustness_table_archive: results/tables/statistical_robustness_comparison_image_level_archive.csv
  patient_cluster_clean_n3_archive: results/tables/statistical_clean_comparison_n3_archive.csv
