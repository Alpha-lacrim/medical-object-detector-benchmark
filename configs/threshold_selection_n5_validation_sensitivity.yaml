schema_version: 1
analysis_id: rsna-phase43-post-hoc-n5-validation-threshold-selection-sensitivity

scope:
  label: post-hoc n=5 validation threshold-selection sensitivity
  selection_split: validation
  test_role: evaluation_only
  expected_detectors: [faster_rcnn, yolo11s]
  historical_seeds: [17, 42, 137]
  sensitivity_seeds: [17, 42, 137, 271, 314]
  inference_seeds: [271, 314]
  influence_seed: 271
  validation_images: 750
  validation_annotations: 277

inputs:
  phase5_config: configs/evaluation.yaml
  phase5_summary: results/logs/phase5_evaluation/summary.json
  checkpoint_manifest: results/checkpoint_release_manifest.json
  validation_split: val
  validation_annotations: data/processed/rsna-pneumonia-5000/annotations/instances_val.json
  historical_config: configs/threshold_selection_n3_frozen.yaml
  historical_manifest: results/logs/phase14_threshold_selection/validation_prediction_manifest.json
  historical_summary: results/logs/phase14_threshold_selection/summary.json
  historical_validation_table: results/tables/validation_threshold_sweep.csv
  historical_validation_per_seed_table: results/tables/validation_threshold_sweep_per_seed.csv
  historical_selected_table: results/tables/selected_operating_points.csv
  historical_selected_per_seed_table: results/tables/selected_operating_points_per_seed.csv
  n5_test_threshold_config: configs/threshold_sweep_n5_sensitivity.yaml
  historical_n5_test_summary: results/logs/phase35_operating_regime_n5/summary.json
  historical_n5_test_table: results/tables/selected_operating_points_n5_sensitivity.csv
  historical_n5_test_per_seed_table: results/tables/selected_operating_points_per_seed_n5_sensitivity.csv

frozen_evaluation:
  score_threshold: 0.25
  match_iou_threshold: 0.5
  coco_minimum_score: 0.001
  nms_iou_threshold: 0.5
  max_detections: 100

reference_check:
  max_true_positive_delta: 0
  max_false_positive_delta: 1
  max_false_negative_delta: 0
  max_prediction_count_delta: 1

selection:
  start: 0.01
  stop: 0.99
  steps: 99
  rule: maximum_mean_f1
  averaging: equal_run_arithmetic_mean
  standard_deviation: sample
  tie_breaker: highest_threshold

comparison:
  mean_metrics: [precision, recall, f1, fp_per_image, prediction_count]
  variability_metrics: [precision, recall, f1, fp_per_image, prediction_count]
  lower_is_preferred: [fp_per_image]
  numeric_tolerance: 1.0e-12

