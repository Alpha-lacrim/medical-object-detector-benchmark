schema_version: 2
analysis_id: rsna-phase42-exact-score-froc-n5-v2

inputs:
  phase5_config: configs/evaluation.yaml
  phase5_summary: results/logs/phase5_evaluation/summary.json
  test_annotations: data/processed/rsna-pneumonia-5000/annotations/instances_test.json
  historical_froc_config: configs/froc_n5_sensitivity.yaml
  historical_froc_summary: results/logs/phase35_operating_regime_n5/froc_summary.json
  historical_curve_table: results/tables/froc_curves_n5_sensitivity.csv
  historical_operating_points_table: results/tables/froc_operating_points_n5_sensitivity.csv

analysis:
  expected_seeds: [17, 42, 137, 271, 314]
  class_names:
    1: Lung Opacity
  candidate_score_floor: 0.001
  match_iou_threshold: 0.5
  nms_iou_threshold: 0.5
  max_detections_per_image: 100
  fp_per_image_budgets: [0.125, 0.25, 0.5, 1.0, 2.0]
  numeric_tolerance: 1.0e-12
  score_comparison: greater_than_or_equal
  include_upper_empty_sentinel: true
  include_candidate_floor_endpoint: true

inference_sensitivity_proposal:
  proposed_candidate_score_floor: 0.0001
  requires_user_approval: true
  selection_basis: one order of magnitude below the detector-neutral frozen floor
  expected_images_per_model: 750
  expected_model_count: 10
  expected_artifacts:
    - ten versioned post-NMS prediction bundles and their hash-bound provenance
    - a versioned lower-floor exact-score FROC summary, per-run and aggregate tables, comparison table, and figure

detectors:
  faster_rcnn:
    label: Faster R-CNN
    color: "#1f77b4"
  yolo11s:
    label: YOLO11s
    color: "#d95f02"

plot:
  dpi: 180
  figure_width: 9.6
  figure_height: 6.4
  minimum_x: 0.0625
  maximum_x: 4.0

outputs:
  exact_per_seed_table: results/tables/froc_exact_score_per_seed_v2.csv
  exact_aggregate_curve_table: results/tables/froc_exact_score_aggregate_v2.csv
  operating_points_per_seed_table: results/tables/froc_operating_points_per_seed_exact_score_v2.csv
  operating_points_table: results/tables/froc_operating_points_exact_score_v2.csv
  historical_comparison_table: results/tables/froc_grid_vs_exact_score_comparison_v2.csv
  figure: results/figures/froc_exact_score_v2.png
  summary_json: results/logs/phase42_froc_exact_score_v2/summary.json
