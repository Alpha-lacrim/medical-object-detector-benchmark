name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      - run: uv sync --locked --group dev --extra cpu
      - run: >-
          uv run --locked --extra cpu ruff format --check src tests
          scripts/verify_scientific_artifacts.py scripts/verify_paper_claims.py
          scripts/build_scientific_artifact_manifest.py
      - run: >-
          uv run --locked --extra cpu ruff check src tests
          scripts/verify_scientific_artifacts.py scripts/verify_paper_claims.py
          scripts/build_scientific_artifact_manifest.py
      - run: uv run --locked --extra cpu python -m pytest -q
      - name: Verify frozen scientific artifacts
        run: uv run --locked --extra cpu python scripts/verify_scientific_artifacts.py
      - name: Verify manuscript numerical claims
        run: uv run --locked --extra cpu python scripts/verify_paper_claims.py
      - run: uv run --locked --extra cpu python -m meddet_benchmark smoke configs/smoke.yaml
